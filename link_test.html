<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .link-container {
            max-width: 400px;
            margin: 0 auto;
        }
        details {
            background-color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        summary {
            list-style: none;
            padding: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            font-size: 16px;
        }
        .dropdown-links {
            padding: 15px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        .btn {
            display: block;
            background: #007bff;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="link-container">
        <details>
            <summary>Test</summary>
            <div class="dropdown-links">
                <a href="https://xorberax.newgrounds.com/" class="btn">A</a>
                <a href="https://www.reddit.com/" class="btn">B</a>
            </div>
        </details>
    </div>

</body>
</html>
